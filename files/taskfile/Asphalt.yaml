#            - "{{.SYMFONY_CONSOLE}} asphalt:csv:migration export"                  # Export Datas
        ignore_error: true
        platforms: [windows/amd64]
    cron:
        desc: "CRON"
        cmds:
            - "{{.SYMFONY_CONSOLE}} asphalt:cron:garage"
            - "{{.SYMFONY_CONSOLE}} asphalt:cron:setting"
            - "{{.SYMFONY_CONSOLE}} asphalt:cron:statistical"
        ignore_error: true
        platforms: [windows/amd64]
    initialize:
        desc: "Initialize Project"
        cmds:
            - "clear"
            # - Task Dev:cache
            - Task Dev:database
            - Task A9:import
            # - Task Dev:launch
            # - "rm -rf public/cache/"
        ignore_error: false
        platforms: [windows/amd64]
    truncate:
        desc: "Truncate Datas"
        cmds:
            - "clear"
            - Task Dev:cache
            - "{{.SYMFONY_CONSOLE}} asphalt:database:truncate"
            - Task A9:import
        ignore_error: false
        platforms: [windows/amd64]
