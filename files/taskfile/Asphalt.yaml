version: '3'

silent: true

vars:
    SYMFONY: symfony
    SYMFONY_CONSOLE: "{{.SYMFONY}} console"

tasks:
    default:
        cmds:
            - task: help

    help:
        desc: Display this help
        cmds:
            - echo "{{.GREETING}}"
            - task --list

    ### ASPHALT

    import:
        desc: "Task Database, Import CSV Files to Database"
        cmds:
            - "{{.SYMFONY_CONSOLE}} asphalt:csv:inventory import"                   # Inventory
            - "{{.SYMFONY_CONSOLE}} asphalt:csv:mission:type import"                # XXXXXXXXX
            - "{{.SYMFONY_CONSOLE}} asphalt:csv:mission:task import"                # XXXXXXXXX
            - "{{.SYMFONY_CONSOLE}} asphalt:csv:mission:app import"                 # XXXXXXXXX
